# Airflow 3.3.2 (LocalExecutor) pro projeto. Uma maquina so: sem Redis/Celery/worker.
#
# network_mode: host de proposito: o Postgres da carteira roda na maquina (localhost:5432) e os scripts de scrape/ leem
# PGHOST=localhost do .env da raiz; no modo bridge teria que mexer em listen_addresses/pg_hba.conf. Portas usadas no
# host: 8080 (UI/API do Airflow) e 5433 (Postgres de metadados do Airflow, separado do banco `investimentos`).
#
# Uso (dentro de orquestracao/):  docker compose up -d --build   |  UI em http://localhost:8080
x-airflow-common: &airflow-common
  build: .
  image: carteira-airflow:3.3.2
  network_mode: host
  security_opt: ["label=disable"]            # Fedora/SELinux: sem isso o bind mount do projeto fica sem permissao
  env_file: [.env]
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-env
    TZ: America/Sao_Paulo                    # os scripts usam datetime.now() (horario do pregao)
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@localhost:5433/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'      # DAG nova nasce pausada: liga na UI quando quiser
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ..:/opt/projeto                         # o projeto inteiro: DAGs chamam /opt/projeto/scrape/*.py (le o .env da raiz)
  depends_on:
    postgres: {condition: service_healthy}

services:
  postgres:
    image: postgres:16
    network_mode: host
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-p", "5433"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}

volumes:
  airflow-db:
